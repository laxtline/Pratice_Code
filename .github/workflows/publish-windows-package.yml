name: Publish Windows installer package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify installer checksum
        run: sha256sum --check Local-Code-Compiler-Setup.sha256
      - name: Publish installer to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file
          -Dfile=Local-Code-Compiler-Setup.exe
          -DpomFile=packages/pom.xml
          -Dpackaging=exe
          -DrepositoryId=github
          -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}"
          -DretryFailedDeploymentCount=2
